[package]
name = "rust_rooms"
version = "1.0.0"
edition = "2024"
default-run = "rust_rooms"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.8", features = ["ws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4"] }
futures = "0.3.32"
url = "2.5"
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
# redis enables rustls without choosing a process-level crypto provider.
# Select one explicitly so rediss:// connections cannot panic at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Embedded TURN relay (mycrl/turn-rs) so calls work behind restrictive NATs
# without an external TURN provider. udp/tcp transports only: the ssl/api/
# prometheus features pull in tonic/axum-server/aws-lc TLS stacks we don't use.
turn-server = { version = "4.1", default-features = false, features = ["udp", "tcp"] }
# Long-term credential mints for the embedded TURN server (HMAC-SHA1 + base64,
# matching turn-server's own static_auth_secret implementation).
base64 = "0.22"
ring = "0.17"


